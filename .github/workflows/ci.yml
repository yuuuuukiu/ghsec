name: CI

# Runs the full verification suite on every push and pull request so a broken
# commit cannot reach a release tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the code is gofmt-clean
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "these files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -count=1

  # The end-to-end suite drives the real binary through a pseudo-terminal, so it
  # only runs where a PTY is available.
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the binary
        run: go build -trimpath -ldflags="-s -w" -o dist/ghsec ./cmd/ghsec

      - name: Run the acceptance suite
        run: python3 scripts/e2e.py dist/ghsec

  # Cross-compilation is checked on one runner: it is the same Go toolchain
  # regardless of host OS, and this keeps the matrix small.
  cross-compile:
    name: cross-compile and size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile every release target
        run: make build-all

      - name: Enforce the ~15 MB binary budget
        run: bash scripts/check-size.sh
